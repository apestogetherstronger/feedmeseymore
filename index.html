<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10"><title>Feed Me, Seymore</title>
<style>
:root{color-scheme:dark;--bg:#0b0d10;--card:#15191f;--muted:#9aa4b2;--line:#252b34;--accent:#b7f36b;--text:#f4f7fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:680px;margin:auto;padding:22px 16px 80px}header{padding:8px 2px 18px;position:sticky;top:0;background:linear-gradient(var(--bg) 80%,transparent);z-index:3}h1{font-size:28px;margin:0 0 5px}.sub{color:var(--muted);font-size:14px}.filters{display:flex;gap:8px;overflow:auto;padding:14px 0 4px}.filter{border:1px solid var(--line);background:#11151a;color:var(--text);padding:8px 13px;border-radius:999px;white-space:nowrap}.filter.on{background:var(--text);color:var(--bg)}#feed{display:grid;gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:19px;overflow:hidden}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#20252c}.body{padding:16px}.meta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;margin-bottom:8px}.type{color:var(--accent);font-weight:700}h2{font-size:20px;line-height:1.2;margin:0 0 9px}.hook{color:#d3dae3;margin:0 0 14px}.actions{display:grid;grid-template-columns:1fr auto;gap:9px}.open,.trello{display:flex;justify-content:center;align-items:center;text-decoration:none;border-radius:12px;padding:11px 12px;font-weight:750}.open{background:var(--accent);color:#10150b}.trello{border:1px solid var(--line);color:var(--text)}.end{text-align:center;color:var(--muted);padding:35px 10px}.count{font-weight:700;color:var(--text)}
</style></head>
<body><main><header><h1>Feed Me, Seymore 🌱</h1><div class="sub"><span class="count" id="count"></span> worthwhile things. Then you're done.</div><div class="filters"><button class="filter on" data-f="all">Anything</button><button class="filter" data-f="5">≤5m</button><button class="filter" data-f="15">≤15m</button><button class="filter" data-f="30">≤30m</button><button class="filter" data-f="long">30m+</button></div></header><section id="feed"></section><div class="end" id="end">🌿 End of the feed.<br>Nothing else is waiting behind it.</div></main>
<script>
const ytId=u=>{let m=u.match(/(?:v=|youtu\.be\/|shorts\/)([\w-]{11})/);return m?.[1]};let items=[];let active='all';
function mins(s=''){if(/<1/.test(s))return .5;let h=s.match(/(\d+)\s*hr/),m=s.match(/(\d+)\s*min/);return(h?+h[1]*60:0)+(m?+m[1]:0)||999}
function render(){let a=items.filter(x=>{let m=mins(x.duration);return active==='all'||active==='5'&&m<=5||active==='15'&&m<=15||active==='30'&&m<=30||active==='long'&&m>30});document.querySelector('#count').textContent=a.length;document.querySelector('#feed').innerHTML=a.map(x=>{let id=ytId(x.source),thumb=x.thumbnail||(id?`https://i.ytimg.com/vi/${id}/hqdefault.jpg`:'');return `<article class="card">${thumb?`<img class="thumb" loading="lazy" src="${thumb}" alt="">`:''}<div class="body"><div class="meta"><span class="type">${x.type||'READ'}</span><span>•</span><span>${x.duration||'Unknown length'}</span><span>•</span><span>${x.channel||x.platform||'Web'}</span></div><h2>${x.title}</h2><p class="hook">${x.hook||x.summary||''}</p><div class="actions"><a class="open" href="${x.source}" target="_blank">Open ${x.type==='READ'?'article':'content'}</a><a class="trello" href="${x.trello}" target="_blank">Trello ↗</a></div></div></article>`}).join('')}
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelector('.filter.on').classList.remove('on');b.classList.add('on');active=b.dataset.f;render()});fetch('./feed.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{items=d.items||[];render()}).catch(()=>{document.querySelector('#feed').innerHTML='<div class="end">Feed data is being prepared.</div>'});
</script></body></html>
